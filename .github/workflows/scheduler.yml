name: Daily WER Automation Scheduler

on:
  # Run every day at 2:00 AM UTC
  schedule:
    - cron: '0 21 * * *'
  
  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable debug logging'
        required: false
        default: 'false'

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    
    # Ensure only one job runs at a time
    concurrency:
      group: scheduler
      cancel-in-progress: false
    
    steps:
      # 1. Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: shraddha  # Use shraddha branch
      
      # 2. Setup Python environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'  # Cache pip dependencies
      
      # 3. Create service account file from GitHub Secret
      - name: Create Google Service Account file
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "Creating service account file..."
          echo "$SERVICE_ACCOUNT_JSON" > app/service.account.json
          echo "✓ Service account file created"
      
      # 4. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          echo "✓ Dependencies installed"
      
      # 5. Run the scheduler
      - name: Run WER Automation Scheduler
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GOOGLE_DRIVE_ROOT_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_ID }}
          SERVICE_ACCOUNT_PATH: app/service.account.json
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          SCHEDULER_ENABLED: 'true'
        run: |
          echo "=========================================="
          echo "Starting WER Automation"
          echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="
          python scripts/run_scheduler_once.py
      
      # 6. Clean up sensitive files
      - name: Cleanup sensitive files
        if: always()  # Run whether job succeeded or failed
        run: |
          echo "Removing service account file..."
          rm -f app/service.account.json
          echo "✓ Cleanup complete"
      
      # 7. Notify on failure (optional)
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::WER Automation job failed!"
          echo "Check the logs above for details."

  # Optional: Send notification to Slack/Email on failure
  notify-failure:
    needs: run-scheduler
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Failure notification
        run: |
          echo "::notice::WER Automation failed. Check workflow logs for details."
