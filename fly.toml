app = "wer-automation-api"
primary_region = "iad"

# Deploy from api branch
[build]
  dockerfile = "Dockerfile.prod"
  
[build.args]
  # Use optimized requirements for production
  

[env]
  PYTHONUNBUFFERED = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8000

[[services.ports]]
  port = 80
  handlers = ["http"]

[[services.ports]]
  port = 443
  handlers = ["tls", "http"]

[env.production]
  BACKEND_API_URL = "https://wer-automation-api.fly.dev"
