# Production configuration for Render deployment
[client]
showErrorDetails = false
toolbarMode = "minimal"
showSidebarNavigation = true

[server]
port = 8501
headless = true
runOnSave = false
maxUploadSize = 200
enableXsrfProtection = true
enableCORS = true

[logger]
level = "warning"

[browser]
gatherUsageStats = false
serverAddress = "wer-automation.onrender.com"

[theme]
primaryColor = "#1e40af"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#1f2937"
font = "sans serif"
